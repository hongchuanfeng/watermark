<body class="h-full flex flex-col">
    <div class="flex-grow">
        <nav class="bg-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center">
                        <h1 class="text-lg sm:text-xl md:text-2xl font-bold text-blue-200 ml-2 sm:ml-4">水印处理</h1>
                    </div>

        <main>
            <div class="max-w-7xl mx-auto py-4 sm:py-6 px-4 sm:px-6 lg:px-8">
                <div class="px-2 sm:px-4 py-4 sm:py-6">
                    <div class="border-4 border-dashed border-gray-200 rounded-lg h-64 sm:h-80 md:h-96 mb-4 relative">
                        <div id="dropzone" class="w-full h-full flex items-center justify-center cursor-pointer absolute inset-0">
                            <div class="text-center px-4">
                                <i class="fas fa-cloud-upload-alt text-3xl sm:text-4xl text-gray-400 mb-2"></i>
                                <p class="text-gray-500 text-sm sm:text-base">在此处单击或拖放图像</p>
                                <p class="dropzone-info text-xs sm:text-sm">支持JPG/PNG格式，最大5MB</p>
                                <input type="file" id="imageInput" accept="image/jpeg,image/png" class="hidden" />
                            </div>
                        </div>
                        <canvas id="imageCanvas" class="hidden w-full h-full object-contain"></canvas>
                        <button id="changeImageButton" class="hidden absolute bottom-2 right-2 text-xs sm:text-sm text-gray-500 underline bg-white px-2 py-1 rounded">替换图像</button>
                    </div>
                    <div id="feedback" class="fixed bottom-4 right-4 hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded shadow-lg" role="alert">
                        <span class="block sm:inline" id="feedbackMessage"></span>
                    </div>
                    <div class="mt-4 md:mt-5 md:col-span-2">
                        <form class="ant-form ant-form-horizontal ant-form-default form-container">
                            <div class="form-row grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                                <div class="form-item col-span-1 sm:col-span-2 lg:col-span-4">
                                    <label for="watermarkText" class="block text-sm font-medium text-gray-700 mb-2">水印文本</label>
                                    <input type="text" name="watermarkText" id="watermarkText" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" value="我爱你" title="请输入水印文字">
                                </div>
                                <div class="form-item col-span-1 sm:col-span-2 lg:col-span-2">
                                    <label for="watermarkColor" class="block text-sm font-medium text-gray-700 mb-2">水印颜色</label>
                                    <div class="flex items-center space-x-2">
                                        <input type="color" name="watermarkColor" id="watermarkColor" value="#FFFFFF" class="w-12 h-10 border border-gray-300 rounded cursor-pointer" title="选择水印颜色">
                                        <input type="text" name="watermarkColorText" id="watermarkColorText" class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" value="#FFFFFF" title="输入水印颜色代码">
                                    </div>
                                </div>
                                <div class="form-item col-span-1 sm:col-span-2 lg:col-span-2">
                                    <label class="block text-sm font-medium text-gray-700 mb-2">水印样式</label>
                                    <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-4">
                                        <label class="flex items-center">
                                            <input type="radio" id="striped" name="watermarkStyle" value="STRIPED" checked class="mr-2">
                                            <span class="text-sm">斜向重复</span>
                                        </label>
                                        <label class="flex items-center">
                                            <input type="radio" id="central" name="watermarkStyle" value="CENTRAL" class="mr-2">
                                            <span class="text-sm">居中</span>
                                        </label>
                                    </div>
                                </div>
                                <div class="form-item col-span-1 sm:col-span-1 lg:col-span-1">
                                    <label for="watermarkAngle" class="block text-sm font-medium text-gray-700 mb-2">水印旋转角度</label>
                                    <div class="space-y-2">
                                        <input type="range" name="watermarkAngle" id="watermarkAngle" min="0" max="360" value="335" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider" title="调整水印的旋转角度">
                                        <div class="flex justify-between text-xs text-gray-500">
                                            <span>0°</span>
                                            <span id="angleValue" class="font-medium">335°</span>
                                            <span>360°</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-item col-span-1 sm:col-span-1 lg:col-span-1">
                                    <label for="watermarkOpacity" class="block text-sm font-medium text-gray-700 mb-2">水印透明度</label>
                                    <div class="space-y-2">
                                        <input type="range" name="watermarkOpacity" id="watermarkOpacity" min="0" max="1" step="0.1" value="0.2" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider" title="调整水印的透明度">
                                        <div class="flex justify-between text-xs text-gray-500">
                                            <span>0</span>
                                            <span id="opacityValue" class="font-medium">0.2</span>
                                            <span>1</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-item col-span-1 sm:col-span-1 lg:col-span-1">
                                    <label for="watermarkSize" class="block text-sm font-medium text-gray-700 mb-2">水印字体大小</label>
                                    <div class="space-y-2">
                                        <input type="range" name="watermarkSize" id="watermarkSize" min="10" max="100" value="16" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider" title="调整水印的字体大小">
                                        <div class="flex justify-between text-xs text-gray-500">
                                            <span>10</span>
                                            <span id="sizeValue" class="font-medium">16</span>
                                            <span>100</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-item col-span-1 sm:col-span-1 lg:col-span-1">
                                    <label for="watermarkSpace" class="block text-sm font-medium text-gray-700 mb-2">水印间距</label>
                                    <div class="space-y-2">
                                        <input type="range" name="watermarkSpace" id="watermarkSpace" min="0" max="100" value="24" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider" title="调整水印的间距">
                                        <div class="flex justify-between text-xs text-gray-500">
                                            <span>0</span>
                                            <span id="spaceValue" class="font-medium">24</span>
                                            <span>100</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-buttons px-2 sm:px-4 py-4 bg-gray-50 sm:px-6">
                                <div class="flex flex-col sm:flex-row gap-3 sm:gap-0 sm:justify-end">
                                    <button type="button" id="applyWatermark" class="w-full sm:w-auto ant-btn ant-btn-primary inline-flex justify-center items-center py-3 px-6 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                                        <i class="fas fa-magic mr-2"></i><span class="relative -top-0.5">应用水印</span>
                                    </button>
                                    <button type="button" id="saveImage" class="w-full sm:w-auto ant-btn ant-btn-success sm:ml-3 inline-flex justify-center items-center py-3 px-6 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors">
                                        <i class="fas fa-download mr-2"></i><span class="relative -top-0.5">保存图片</span>
                                    </button>
                                </div>
